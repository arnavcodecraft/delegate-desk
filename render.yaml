# Render blueprint for the DelegateDesk server (the part Cloudflare Pages forwards /api to).
# Render → New → Blueprint → pick this repository. The disk keeps the database and uploads between deploys.
services:
  - type: web
    name: delegatedesk-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BASE_URL
        sync: false          # your Cloudflare Pages address, e.g. https://delegatedesk.pages.dev
      - key: PROXY_SECRET
        sync: false          # the same value you set in Cloudflare Pages
      - key: TRUST_PROXY
        value: "2"
      - key: APP_SECRET
        generateValue: true
      - key: MAIL_FROM
        sync: false          # e.g. TMUN <hello@yourdomain.com> (must be a sender your email service allows)
      - key: RESEND_API_KEY
        sync: false          # email option 1 (resend.com)
      - key: BREVO_API_KEY
        sync: false          # email option 2 (brevo.com)
      - key: SMTP_URL
        sync: false          # email option 3, e.g. smtps://you%40gmail.com:app-password@smtp.gmail.com:465
      - key: GEMINI_API_KEY
        sync: false          # AI with Google AI Studio (aistudio.google.com/apikey)
      - key: AI_PROVIDER
        value: gemini
      - key: ANTHROPIC_API_KEY
        sync: false          # or AI with Claude (then set AI_PROVIDER=anthropic)
