<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f4fe0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DelegateDesk" />
    <title>DelegateDesk</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before anything paints, so the loading screen and the page start in the right colours.
      try { var t = localStorage.getItem('dd-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
      window.__ddLoadStart = Date.now();
    </script>
    <style>
      /* The loading screen: on every load, the DelegateDesk mark and name fill with water as the app loads. */
      #dd-preload { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: radial-gradient(1200px 700px at 50% 40%, #12286b 0%, #0a1a4d 45%, #060f33 100%); color: #f3efe6; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .55s ease, visibility .55s, transform .55s ease; }
      #dd-preload.done { opacity: 0; visibility: hidden; transform: scale(1.03); }
      .ddp-logo { width: min(560px, 90vw); height: auto; overflow: visible; }
      .ddp-ghost { fill: rgb(243 239 230 / .13); }
      .ddp-ghost-line { fill: none; stroke: rgb(243 239 230 / .28); stroke-width: 1.4; }
      .ddp-water { transition: transform .35s cubic-bezier(.3, .7, .4, 1); }
      .ddp-wave { animation: ddp-flow 2.6s linear infinite; }
      .ddp-wave.b { animation-duration: 3.8s; animation-direction: reverse; }
      .ddp-swash { stroke: #f2b53a; stroke-width: 5; stroke-linecap: round; fill: none; stroke-dasharray: 160; stroke-dashoffset: 160; opacity: 0; transition: stroke-dashoffset .5s ease, opacity .1s; }
      #dd-preload.full .ddp-swash { stroke-dashoffset: 0; opacity: 1; }
      .ddp-foot { position: absolute; left: 50%; bottom: max(28px, 6vh); transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; }
      .ddp-pct { font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; font-stretch: condensed; }
      .ddp-pct small { font-size: .8em; margin-left: 4px; font-weight: 700; opacity: .85; }
      .ddp-track { width: 140px; height: 3px; border-radius: 3px; background: rgb(243 239 230 / .2); overflow: hidden; }
      .ddp-fill { height: 100%; width: 0; background: #f3efe6; border-radius: inherit; transition: width .35s cubic-bezier(.3, .7, .4, 1); }
      .ddp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      @keyframes ddp-flow { from { transform: translateX(0); } to { transform: translateX(-200px); } }
      @media (prefers-reduced-motion: reduce) { .ddp-wave { animation: none; } }
    </style>
  </head>
  <body>
    <div id="dd-preload" role="progressbar" aria-label="Loading DelegateDesk" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="ddp-logo" viewBox="0 0 560 150" aria-hidden="true">
        <defs>
          <clipPath id="ddp-clip">
            <rect x="8" y="27" width="96" height="96" rx="26" />
            <text x="128" y="101" font-size="70" font-weight="800" textLength="424" lengthAdjust="spacingAndGlyphs" letter-spacing="-2">DelegateDesk</text>
          </clipPath>
          <mask id="ddp-d"><rect x="0" y="0" width="560" height="150" fill="#fff" /><text x="56" y="99" font-size="64" font-weight="800" text-anchor="middle" fill="#000">D</text></mask>
        </defs>
        <!-- The empty outline -->
        <g mask="url(#ddp-d)"><rect class="ddp-ghost" x="8" y="27" width="96" height="96" rx="26" /></g>
        <text class="ddp-ghost" x="128" y="101" font-size="70" font-weight="800" textLength="424" lengthAdjust="spacingAndGlyphs" letter-spacing="-2">DelegateDesk</text>
        <rect class="ddp-ghost-line" x="8" y="27" width="96" height="96" rx="26" />
        <!-- The water, rising as the app loads -->
        <g clip-path="url(#ddp-clip)">
          <g mask="url(#ddp-d)">
            <g class="ddp-water" id="ddp-water" transform="translate(0 130)">
              <path class="ddp-wave b" fill="#7aa2ff" opacity=".55" d="M0 8 Q 50 -4 100 8 T 200 8 T 300 8 T 400 8 T 500 8 T 600 8 T 700 8 T 800 8 V 200 H 0 Z" />
              <path class="ddp-wave" fill="#f3efe6" d="M0 12 Q 50 2 100 12 T 200 12 T 300 12 T 400 12 T 500 12 T 600 12 T 700 12 T 800 12 V 200 H 0 Z" />
            </g>
          </g>
        </g>
        <path class="ddp-swash" d="M396 128 C 450 118, 505 116, 548 122" />
      </svg>
      <div class="ddp-foot"><div class="ddp-pct"><span id="ddp-num">0</span><small>%</small></div><div class="ddp-track"><div class="ddp-fill" id="ddp-fill"></div></div></div>
      <span class="ddp-sr">Loading DelegateDesk</span>
    </div>
    <script>
      // The loading screen's progress: it climbs while the app loads, waits for the app (and at least a moment), fills to 100%, then fades.
      (function () {
        var el = document.getElementById('dd-preload'), water = document.getElementById('ddp-water'), num = document.getElementById('ddp-num'), fill = document.getElementById('ddp-fill');
        var MIN = 2200, start = window.__ddLoadStart || Date.now(), pct = 0, ready = false, finished = false;
        function show(p) {
          pct = p; var r = Math.round(p);
          num.textContent = r; fill.style.width = r + '%'; el.setAttribute('aria-valuenow', r);
          // Water from below the logo (y 130) to above it (y 18).
          water.setAttribute('transform', 'translate(0 ' + (130 - p * 1.12).toFixed(1) + ')');
        }
        var t = setInterval(function () {
          var e = Date.now() - start;
          var target = ready && e >= MIN ? 100 : Math.min(94, 94 * (1 - Math.exp(-e / 1300)));
          var step = Math.max(0.3, (target - pct) * 0.1); show(pct + step > target ? target : pct + step);
          if (pct >= 100 && !finished) { finished = true; clearInterval(t); el.classList.add('full'); setTimeout(function () { el.classList.add('done'); setTimeout(function () { el.remove(); }, 650); }, 600); }
        }, 40);
        window.__ddDone = function () { ready = true; };
        // Never leave someone stuck behind it.
        setTimeout(function () { ready = true; }, 9000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
