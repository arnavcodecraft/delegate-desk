<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f4fe0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DelegateDesk" />
    <title>DelegateDesk</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before anything paints, so the loading screen and the page start in the right colours.
      try { var t = localStorage.getItem('dd-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
      window.__ddLoadStart = Date.now();
    </script>
    <style>
      /* The loading screen: shown on every load until the app is ready (and at least a moment, so it never flashes). */
      #dd-preload { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: #f7f9fd; color: #0b1630; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .45s ease, visibility .45s; }
      :root[data-theme="dark"] #dd-preload { background: #040817; color: #eef3ff; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #dd-preload { background: #040817; color: #eef3ff; } }
      #dd-preload.done { opacity: 0; visibility: hidden; }
      .ddp { display: grid; justify-items: center; gap: 22px; text-align: center; padding: 24px; }
      .ddp-stage { position: relative; width: 168px; height: 168px; }
      .ddp-globe { position: absolute; inset: 0; animation: ddp-spin 9s linear infinite; }
      .ddp-globe ellipse, .ddp-globe circle, .ddp-globe path { fill: none; stroke: #1f4fe0; stroke-width: 2; opacity: .35; }
      .ddp-globe .rim { opacity: .9; stroke-width: 2.5; }
      :root[data-theme="dark"] .ddp-globe * { stroke: #7aa2ff; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ddp-globe * { stroke: #7aa2ff; } }
      .ddp-gavel { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -58px 0 0 -30px; transform-origin: 78% 82%; animation: ddp-strike 1.4s cubic-bezier(.5, 0, .3, 1) infinite; }
      .ddp-block { position: absolute; left: 50%; bottom: 30px; width: 62px; height: 14px; margin-left: -31px; border-radius: 4px; background: linear-gradient(180deg, #c98a4b, #8a5524); box-shadow: 0 4px 0 #6d3f16; }
      .ddp-ring { position: absolute; left: 50%; bottom: 36px; width: 20px; height: 8px; margin-left: -10px; border-radius: 50%; border: 2px solid #f2b53a; opacity: 0; animation: ddp-ring 1.4s ease-out infinite; }
      .ddp-word { display: flex; gap: 10px; align-items: center; font-weight: 800; font-size: 22px; letter-spacing: -.01em; }
      .ddp-word i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 17px; background: linear-gradient(135deg, #0b2a8a, #1f4fe0 55%, #4d84ff); box-shadow: 0 8px 18px -8px rgb(31 79 224 / .8); }
      .ddp-line { height: 20px; font-size: 14.5px; font-weight: 600; opacity: .62; position: relative; width: 280px; }
      .ddp-line span { position: absolute; inset: 0; opacity: 0; animation: ddp-say 6.4s infinite; }
      .ddp-line span:nth-child(2) { animation-delay: 1.6s; } .ddp-line span:nth-child(3) { animation-delay: 3.2s; } .ddp-line span:nth-child(4) { animation-delay: 4.8s; }
      .ddp-bar { width: 180px; height: 4px; border-radius: 999px; background: rgb(31 79 224 / .15); overflow: hidden; }
      .ddp-bar i { display: block; height: 100%; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #1f4fe0, #a77bff); animation: ddp-bar 1.3s ease-in-out infinite; }
      @keyframes ddp-spin { to { transform: rotate(360deg); } }
      @keyframes ddp-strike { 0%, 100% { transform: rotate(-28deg); } 42% { transform: rotate(-28deg); } 58% { transform: rotate(8deg); } 66% { transform: rotate(2deg); } 78% { transform: rotate(-18deg); } }
      @keyframes ddp-ring { 0%, 56% { opacity: 0; transform: scale(.6); } 60% { opacity: .9; } 100% { opacity: 0; transform: scale(3.4); } }
      @keyframes ddp-say { 0% { opacity: 0; transform: translateY(6px); } 5%, 22% { opacity: 1; transform: none; } 27%, 100% { opacity: 0; transform: translateY(-6px); } }
      @keyframes ddp-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .ddp-globe, .ddp-gavel, .ddp-ring, .ddp-bar i { animation: none; } .ddp-line span { animation: none; } .ddp-line span:first-child { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="dd-preload" role="status" aria-live="polite" aria-label="Loading DelegateDesk">
      <div class="ddp">
        <div class="ddp-stage" aria-hidden="true">
          <svg class="ddp-globe" viewBox="0 0 168 168"><circle class="rim" cx="84" cy="84" r="76"/><ellipse cx="84" cy="84" rx="30" ry="76"/><ellipse cx="84" cy="84" rx="56" ry="76"/><path d="M8 84h152M18 46h132M18 122h132"/></svg>
          <span class="ddp-ring"></span>
          <span class="ddp-block"></span>
          <svg class="ddp-gavel" viewBox="0 0 92 92"><rect x="8" y="16" width="42" height="22" rx="6" transform="rotate(-30 29 27)" fill="#8a5524"/><rect x="12" y="20" width="34" height="14" rx="4" transform="rotate(-30 29 27)" fill="#c98a4b"/><rect x="34" y="34" width="8" height="52" rx="4" transform="rotate(-30 38 60)" fill="#a8692f"/></svg>
        </div>
        <div class="ddp-word"><i>D</i>DelegateDesk</div>
        <div class="ddp-line"><span>Calling the roll…</span><span>Opening the speakers list…</span><span>The chair recognises the delegate…</span><span>Order in the committee…</span></div>
        <div class="ddp-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
