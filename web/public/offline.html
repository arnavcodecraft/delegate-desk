<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Offline · DelegateDesk</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f8fc; --card: #fff; --ink: #0b1630; --ink2: #4a5874; --brand: #1f4fe0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #060b18; --card: #0d1730; --ink: #eef3ff; --ink2: #aab6d0; --brand: #5b8cff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--card); border-radius: 20px; padding: 32px 28px; max-width: 420px; text-align: center; box-shadow: 0 20px 50px -20px rgb(16 36 84 / .3); }
  img { width: 64px; height: 64px; } h1 { font-size: 22px; margin: 14px 0 6px; } p { color: var(--ink2); margin: 0 0 18px; }
  button { font: inherit; font-weight: 650; border: 0; border-radius: 12px; padding: 12px 22px; background: var(--brand); color: #fff; cursor: pointer; }
</style></head>
<body><main><img src="/icons/icon-192.png" alt=""><h1>You’re offline</h1><p>DelegateDesk needs the internet to load live data. Check your connection and try again. Organisers: your offline copy (Settings → Backups) opens without the internet.</p><button onclick="location.reload()">Try again</button></main></body></html>
